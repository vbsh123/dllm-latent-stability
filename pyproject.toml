[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dllm-latent-phase1"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "pyarrow==19.0.1", "scikit-learn==1.6.1", "matplotlib==3.10.1"]

[project.optional-dependencies]
gpu = ["transformers==4.46.3", "accelerate==1.4.0", "huggingface-hub==0.29.3", "datasets==3.3.2", "einops==0.8.1", "sentencepiece==0.2.0"]
test = ["pytest==8.3.5", "transformers==4.46.3"]

[tool.setuptools.packages.find]
include = ["dllm_latent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
